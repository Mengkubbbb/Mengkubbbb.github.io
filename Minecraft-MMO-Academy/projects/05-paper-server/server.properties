# server.properties — ไฟล์ตั้งค่าเซิร์ฟเวอร์ Minecraft (ตัวอย่างสำหรับเซิร์ฟเวอร์ทดสอบ)
#
# ⚠️ สำคัญ: ค่าที่ถูกต้องที่สุดคือ "ไฟล์ที่ Paper สร้างเอง" หลังจากรันครั้งแรก
#    ใช้ไฟล์นี้เป็นจุดเริ่มต้น แล้วเทียบกับไฟล์จริงที่ Paper สร้าง
#    (บางคีย์อาจเพิ่ม/เปลี่ยนชื่อได้ตามเวอร์ชัน — ให้ยึดไฟล์จริงเป็นหลัก)

# ข้อความที่แสดงในหน้ารายชื่อเซิร์ฟเวอร์ (\u00A7 = เครื่องหมายสี)
motd=Eclipse MMO RPG \u00A76[\u00A7aTEST\u00A76] \u00A7fมาเล่นกัน!

# พอร์ตที่ผู้เล่นเชื่อมต่อ (ค่าเริ่มต้นของ Minecraft)
server-port=25565

# ตรวจสอบบัญชีกับระบบ Mojang
#   true  = ปลอดภัย (แนะนำสำหรับเซิร์ฟเวอร์จริง)
#   false = คนที่ไม่มีบัญชีแท้เข้าได้ (⚠️ อันตราย + เปิดช่องปลอมชื่อ)
online-mode=true

# ที่อยู่ที่ผูก (เว้นว่าง = ผูกทุกการ์ดเครือข่าย)
server-ip=

# จำนวนผู้เล่นสูงสุด
max-players=20

# ใช้รายชื่อผู้เล่นที่อนุญาต (แนะนำมากช่วงทดสอบ)
white-list=true
enforce-whitelist=true

# ระยะมองเห็น/จำลอง (ค่าสูง = สวยขึ้นแต่กิน RAM/CPU)
#   เซิร์ฟเวอร์ RAM 2 GB → แนะนำ view-distance 6-8
view-distance=8
simulation-distance=6

# โหมดเกมและความยาก
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
pvp=true

# โลก
level-name=world
level-seed=
level-type=minecraft\:normal
generate-structures=true
spawn-protection=0
allow-nether=true
allow-end=true

# การเคลื่อนที่
allow-flight=false

# สัตว์/มอน
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
max-entity-collisions=8

# ระบบอื่น ๆ
enable-command-block=false
enable-query=false
enable-status=true
enable-rcon=false
rcon.password=
rcon.port=25575

# การแจก resource pack ให้ผู้เล่นอัตโนมัติ (ใช้ใน Month 7)
#   ตัวอย่าง: resource-pack=https\://example.com/pack.zip
#   resource-pack-sha1=<ค่า sha1 ของไฟล์>
resource-pack=
resource-pack-sha1=
require-resource-pack=false

# การบันทึกและประสิทธิภาพ
sync-chunk-writes=true
max-tick-time=60000
network-compression-threshold=256

# ผู้เล่นใหม่
player-idle-timeout=0
hide-online-players=false

# ค่าที่ Paper เพิ่มเองจะอยู่ในโฟลเดอร์ config/ (เช่น paper-global.yml)
# อย่าแก้ไฟล์ใน config/ ก่อนอ่านคอมเมนต์ในนั้นให้ดี
